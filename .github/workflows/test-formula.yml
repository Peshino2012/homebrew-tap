name: test-formula

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Formula/**"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap this local checkout
        run: brew tap peshino2012/tap "$PWD"
      - name: Audit the formula
        run: brew audit --strict peshino2012/tap/agents-md-gen
      - name: Install
        run: brew install --build-from-source peshino2012/tap/agents-md-gen
      - name: Run brew test
        run: brew test peshino2012/tap/agents-md-gen
      - name: Verify it actually runs
        run: agents-md-gen --help
